# Scans on a schedule in the cloud, so you get phone alerts and an up-to-date report
# without keeping a computer on.
#
# Setup (repo Settings):
#  - Secrets and variables > Actions > Secrets: MKM_APP_TOKEN, MKM_APP_SECRET, MKM_ACCESS_TOKEN,
#    MKM_ACCESS_SECRET, EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, PRICECHARTING_TOKEN,
#    TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (and/or DISCORD_WEBHOOK). Set only the ones you have.
#  - For the web app on your phone: Settings > Pages > Source = "GitHub Actions" (one-time).
#    Until that is set the deploy job is skipped with a warning; scans and alerts still run.
#    Pages on a private repo needs a paid plan; the page is reachable by anyone with the URL.
#  - Until at least one data-source key is set, scans use clearly labelled demo data.
name: Scan

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button, also available in the GitHub mobile app
    inputs:
      demo:
        description: "Use made-up demo data (no API keys needed)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Sold-comp history and "already alerted" state persist between runs via the cache.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Scan
        env:
          MKM_APP_TOKEN: ${{ secrets.MKM_APP_TOKEN }}
          MKM_APP_SECRET: ${{ secrets.MKM_APP_SECRET }}
          MKM_ACCESS_TOKEN: ${{ secrets.MKM_ACCESS_TOKEN }}
          MKM_ACCESS_SECRET: ${{ secrets.MKM_ACCESS_SECRET }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          CONFIG=config.yaml; [ -f "$CONFIG" ] || CONFIG=config.example.yaml
          export VDF_REPORT_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          DEMO=""
          if [ "${{ inputs.demo }}" = "true" ] || [ "${{ vars.VDF_DEMO }}" = "true" ]; then DEMO="--demo"; fi
          if [ -z "$EBAY_CLIENT_ID$MKM_APP_TOKEN$PRICECHARTING_TOKEN" ]; then
            echo "::notice::No data-source keys set yet; publishing demo data. See docs/API_KEYS.md"
            DEMO="--demo"
          fi
          python -m vdf --config "$CONFIG" scan --out site $DEMO

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: history-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: vars.PUBLISH_PAGES != 'false'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # Pages not switched on yet: don't fail the whole run
      - if: steps.deploy.outcome == 'failure'
        run: echo "::warning::Publishing skipped. Turn on Settings > Pages > Source = GitHub Actions, then re-run." 
