# Scans on a schedule in the cloud, so you get phone alerts and an up-to-date report
# without keeping a computer on.
#
# Setup (repo Settings):
#  - Secrets and variables > Actions > Secrets: MKM_APP_TOKEN, MKM_APP_SECRET, MKM_ACCESS_TOKEN,
#    MKM_ACCESS_SECRET, EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, PRICECHARTING_TOKEN,
#    TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (and/or DISCORD_WEBHOOK). Set only the ones you have.
#  - Optional, for the web app on your phone: Variables > PUBLISH_PAGES = true, and
#    Settings > Pages > Source = "GitHub Actions". Note: Pages on a private repo needs a paid plan,
#    and the published page is reachable by anyone who has the URL.
name: Scan

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:          # "Run workflow" button, also available in the GitHub mobile app

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Sold-comp history and "already alerted" state persist between runs via the cache.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Scan
        env:
          MKM_APP_TOKEN: ${{ secrets.MKM_APP_TOKEN }}
          MKM_APP_SECRET: ${{ secrets.MKM_APP_SECRET }}
          MKM_ACCESS_TOKEN: ${{ secrets.MKM_ACCESS_TOKEN }}
          MKM_ACCESS_SECRET: ${{ secrets.MKM_ACCESS_SECRET }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VDF_REPORT_URL: ${{ vars.PUBLISH_PAGES == 'true' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
        run: |
          CONFIG=config.yaml; [ -f "$CONFIG" ] || CONFIG=config.example.yaml
          python -m vdf --config "$CONFIG" scan --out site

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: history-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_PAGES == 'true'
        with:
          path: site

  deploy:
    if: vars.PUBLISH_PAGES == 'true'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
